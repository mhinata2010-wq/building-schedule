name: Test Firebase mirror worker
on:
  pull_request:
    paths:
      - 'cloud/firebase-mirror/**'
      - 'database/firebase-outbox.sql'
      - 'firebase/firestore.rules'
      - '.github/workflows/firebase-mirror-tests.yml'
  push:
    paths:
      - 'cloud/firebase-mirror/**'
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check cloud/firebase-mirror/mirror-core.mjs
          node --check cloud/firebase-mirror/worker.mjs
          node --check cloud/firebase-mirror/test.mjs
      - name: Mock unit tests
        run: node --test cloud/firebase-mirror/test.mjs
