<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Building Schedule｜現場工程表</title><link rel="stylesheet" href="style.css?v=20261029-codebase">
</head>
<body>
<div class="app-shell">
<aside class="sidebar">
  <div class="sidebar-brand"><span class="brand-mark">BS</span><strong>BUILDING<br>SCHEDULE</strong></div>
  <div class="project-label">PROJECT</div>
  <div class="project-name">総合工程表<small>Master Schedule</small></div>
  <nav class="side-nav">
    <button class="side-link active" data-view="gantt"><span class="nav-icon">▦</span><span>工程表</span></button>
    <button class="side-link" data-view="network"><span class="nav-icon">⌘</span><span>ネットワーク工程表</span></button>
  </nav>
  <div class="sidebar-note"><span>操作</span><p>日付の上を横にドラッグして工程バーを追加できます。</p></div>
</aside>
<div class="workspace">
<header class="topbar">
  <button class="menu-button" aria-label="メニュー">☰</button>
  <div class="topbar-title"><strong>総合工程表</strong><span>/ 現場工程管理</span></div>
  <div class="topbar-actions"><span class="save-state"><i></i>保存済み</span><button id="reset" class="icon-action">↻ <span>サンプルに戻す</span></button></div>
</header>
<main class="content">
  <div class="content-head">
    <div><p class="breadcrumb">PROJECT / MASTER SCHEDULE</p><h1>総合工程表</h1><p>バーを直接引いて工程をつくり、作業の前後関係からネットワーク工程表へ反映します。</p></div>
    <button id="add" class="primary">＋ 工程を追加</button>
  </div>
  <section id="gantt" class="view-section">
    <div class="block">
      <div class="block-head"><div><strong>工程タイムライン</strong><small>空いている行を横方向にドラッグして工程を追加</small></div><span class="badge">工程表</span></div>
      <div class="schedule-scroll"><div class="schedule-min"><div class="dates" id="dates"></div><div id="rows"></div></div></div>
    </div>
  </section>
  <section id="network" class="view-section" hidden>
    <div class="block">
      <div class="block-head"><div><strong>ネットワーク工程表</strong><small>工程表で設定した前後関係を同じデータから表示</small></div><span class="badge">自動反映</span></div>
      <svg id="networkSvg" viewBox="0 0 1000 520" aria-label="ネットワーク工程表"></svg>
    </div>
  </section>
</main>
</div>
</div>
<dialog id="editor"><form id="editorForm"><div class="dialog-head"><div><span>工程情報</span><h2 id="editorTitle">工程を編集</h2></div><button id="dialogClose" type="button" aria-label="閉じる">×</button></div><label>工程名<input id="name" placeholder="例：基礎工事" required></label><div class="two"><label>開始日<input id="start" type="date" required></label><label>終了日<input id="end" type="date" required></label></div><label>前工程<select id="predecessor"><option value="">なし</option></select></label><p class="hint">前工程を設定すると、ネットワーク工程表にも同じ前後関係が反映されます。</p><div class="actions"><button id="cancel" type="button">キャンセル</button><button id="save" type="submit">保存する</button></div></form></dialog>
<script src="app.js?v=20261029-codebase"></script><script>document.getElementById('dialogClose').addEventListener('click',()=>document.getElementById('cancel').click());</script>
</body></html>
