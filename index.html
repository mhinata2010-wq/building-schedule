<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Building Schedule｜工程を考えるキャンバス</title>
<link rel="stylesheet" href="style.css?v=20261031-direct-canvas">
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <div class="brand"><span class="brand-mark">BS</span><div><strong>Building Schedule</strong><small>工程を考えるキャンバス</small></div></div>
  <div class="project-title"><span>PROJECT</span><strong>総合工程表</strong></div>
  <div class="top-actions"><span id="saveState" class="save-state"><i></i>保存済み</span><button id="reset" class="ghost">↻ サンプルに戻す</button></div>
</header>
<main class="workspace">
  <section class="commandbar">
    <div class="mode-tabs"><button class="mode active" data-view="gantt">工程を考える</button><button class="mode" data-view="network">前後関係を見る</button></div>
    <div class="canvas-tools">
      <button id="today" class="tool">今日</button>
      <div class="zoom-group" aria-label="表示単位"><button data-zoom="day" class="zoom active">日</button><button data-zoom="week" class="zoom">週</button><button data-zoom="month" class="zoom">月</button></div>
      <button id="fit" class="tool">全体表示</button>
      <button id="addRow" class="primary">＋ 工程</button>
    </div>
  </section>

  <section id="gantt" class="view-section">
    <div class="guidance"><strong>工程をそのまま動かして検討</strong><span>空白を横にドラッグして作成 ／ バーを移動 ／ 端を伸縮 ／ 左の ⠿ で順番変更</span></div>
    <div class="schedule-card">
      <div class="schedule-viewport" id="scheduleViewport">
        <div class="schedule-canvas" id="scheduleCanvas">
          <div class="corner"><span>工程</span><small>ドラッグで並べ替え</small></div>
          <div class="dates" id="dates"></div>
          <div class="rows" id="rows"></div>
        </div>
      </div>
      <div class="overview-bar"><div><strong>全体</strong><span id="rangeLabel"></span></div><div class="mini-map" id="miniMap"><div id="miniTasks"></div><div class="mini-window" id="miniWindow"></div></div></div>
    </div>
  </section>

  <section id="network" class="view-section" hidden>
    <div class="network-head"><div><strong>前後関係</strong><span>工程キャンバスと同じデータから自動生成</span></div></div>
    <div class="network-wrap"><svg id="networkSvg" viewBox="0 0 1200 600" aria-label="ネットワーク工程表"></svg></div>
  </section>
</main>
</div>

<aside id="inspector" class="inspector" aria-hidden="true">
  <div class="inspector-head"><div><span>工程の詳細</span><h2 id="inspectorTitle">工程</h2></div><button id="closeInspector" aria-label="閉じる">×</button></div>
  <label>工程名<input id="taskName"></label>
  <div class="two"><label>開始日<input id="taskStart" type="date"></label><label>終了日<input id="taskEnd" type="date"></label></div>
  <label>前工程<select id="taskPred"><option value="">なし</option></select></label>
  <p class="hint">日付はバーを直接動かす方が速く変更できます。詳細入力は必要なときだけ使います。</p>
  <button id="deleteTask" class="danger">工程を削除</button>
</aside>
<script src="app.js?v=20261031-direct-canvas"></script>
</body></html>
