<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Building Schedule</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f6f7f9}
    *{box-sizing:border-box}body{margin:0}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(720px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,.06)}h1{margin:0 0 10px;font-size:32px}p{margin:0;color:#6b7280;line-height:1.7}.status{display:inline-flex;margin-top:24px;padding:8px 12px;border-radius:999px;background:#ecfdf5;color:#047857;font-weight:700;font-size:14px}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Building Schedule</h1>
      <p>建築現場向け工程表アプリの新リポジトリです。現在、旧プロジェクトから必要な機能だけを整理して移行しています。</p>
      <div class="status">GitHub Pages entry point ready</div>
    </section>
  </main>
</body>
</html>
