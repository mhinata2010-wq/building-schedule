<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Building Schedule｜現場工程表</title><link rel="stylesheet" href="style.css?v=20261030-final">
</head>
<body>
<header class="app-header"><div class="brand"><span class="brand-mark">BS</span><div><b>Building Schedule</b><small>現場工程管理</small></div></div><div class="header-actions"><span class="status"><i></i>保存済み</span><button id="reset" class="ghost">サンプルに戻す</button></div></header>
<main>
<section class="page-head"><div><p class="eyebrow">PROJECT / MASTER SCHEDULE</p><h1>総合工程表</h1><p class="lead">バーを直接引いて工程をつくり、前後関係からネットワーク工程表を自動生成します。</p></div><button id="add" class="primary">＋ 工程を追加</button></section>
<section class="guide" aria-label="操作フロー"><div><span>01</span><p><b>バーを引く</b><small>日付上をドラッグ</small></p></div><i>→</i><div><span>02</span><p><b>工程を設定</b><small>名称・期間・前工程</small></p></div><i>→</i><div><span>03</span><p><b>自動反映</b><small>ネットワーク工程表</small></p></div></section>
<nav class="view-tabs"><button class="tab active" data-tab="gantt"><span>工程表</span><small>Gantt</small></button><button class="tab" data-tab="network"><span>ネットワーク工程表</span><small>Network</small></button></nav>
<section id="gantt" class="panel">
<div class="toolbar"><div><strong>工程タイムライン</strong><span>空いている行を横方向にドラッグして追加</span></div><div class="legend"><i></i>工程バー</div></div>
<div class="schedule-scroll"><div class="schedule-min"><div class="dates" id="dates"></div><div id="rows"></div></div></div>
</section>
<section id="network" class="panel" hidden>
<div class="toolbar"><div><strong>ネットワーク工程表</strong><span>工程表の前後関係を同じデータから表示</span></div><div class="legend"><i></i>自動生成</div></div>
<svg id="networkSvg" viewBox="0 0 1000 520" aria-label="ネットワーク工程表"></svg>
</section>
</main>
<dialog id="editor"><form id="editorForm"><div class="dialog-head"><div><span class="eyebrow">TASK DETAIL</span><h2 id="editorTitle">工程を編集</h2></div><button id="dialogClose" type="button" aria-label="閉じる">×</button></div><label>工程名<input id="name" placeholder="例：基礎工事" required></label><div class="two"><label>開始日<input id="start" type="date" required></label><label>終了日<input id="end" type="date" required></label></div><label>前工程<select id="predecessor"><option value="">なし</option></select></label><p class="hint">前工程を設定すると、ネットワーク工程表にも同じ依存関係が反映されます。</p><div class="actions"><button id="cancel" type="button">キャンセル</button><button id="save" type="submit">保存する</button></div></form></dialog>
<script src="app.js?v=20261030-final"></script><script>document.getElementById('dialogClose').addEventListener('click',()=>document.getElementById('cancel').click());</script>
</body></html>
