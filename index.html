<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>building schedule</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div><b>BUILDING SCHEDULE</b><span>現場工程表</span></div><button id="reset">サンプルに戻す</button></header>
<main>
<section class="intro"><p>MASTER SCHEDULE</p><h1>バーからつくる工程表</h1><div class="flow"><b>1 バーを書く</b><i>→</i><b>2 前後関係を入れる</b><i>→</i><b>3 ネットワークへ反映</b></div></section>
<nav><button class="tab active" data-tab="gantt">工程表</button><button class="tab" data-tab="network">ネットワーク工程表</button></nav>
<section id="gantt" class="panel">
<div class="toolbar"><strong>総合工程表</strong><span>空いている日付をドラッグして工程を追加</span><button id="add">＋ 工程を追加</button></div>
<div class="dates" id="dates"></div><div id="rows"></div>
</section>
<section id="network" class="panel" hidden>
<div class="toolbar"><strong>ネットワーク工程表</strong><span>工程表で入力した前後関係から自動生成</span></div>
<svg id="networkSvg" viewBox="0 0 1000 520" aria-label="ネットワーク工程表"></svg>
</section>
</main>
<dialog id="editor"><form method="dialog"><h2 id="editorTitle">工程を編集</h2><label>工程名<input id="name" required></label><div class="two"><label>開始日<input id="start" type="date" required></label><label>終了日<input id="end" type="date" required></label></div><label>前工程<select id="predecessor"><option value="">なし</option></select></label><p>前工程を設定するとネットワーク工程表へ同じ関係が反映されます。</p><div class="actions"><button value="cancel">キャンセル</button><button id="save" value="default">保存</button></div></form></dialog>
<script src="app.js"></script>
</body></html>
